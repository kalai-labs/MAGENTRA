<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brain editor · MAGENTRA</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#home" aria-label="Brain editor home">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.75" y="2.75" width="18.5" height="18.5" rx="5.5" stroke-width="1.6" />
          <path d="M6.6 16.6 L6.6 7.8 L12 12.9 L17.4 7.8 L17.4 16.6" stroke-width="2" />
        </svg>
        <span class="brand-name">MAGENTRA</span>
        <span class="brand-tool">Brain editor</span>
      </a>
      <button class="folder" id="folderButton" type="button" aria-haspopup="menu" aria-expanded="false">
        <span class="folder-path" id="folderPath">brain/</span>
        <span class="folder-kind" id="folderKind">Shipped brain</span>
      </button>
      <div class="menu" id="folderMenu" role="menu" hidden>
        <button type="button" role="menuitem" data-action="profile">Copy this brain to a new folder…</button>
        <button type="button" role="menuitem" data-action="open">Open another brain folder…</button>
        <button type="button" role="menuitem" data-action="shipped" id="backToShipped">Go back to brain/</button>
      </div>
      <div class="top-spacer"></div>
      <div class="engine" id="engineStatus" role="status" aria-live="polite"></div>
      <button class="btn" id="buildButton" type="button">Build</button>
    </header>

    <div class="shell">
      <nav class="rail" aria-label="Parts of the brain">
        <div class="mini" id="miniWrap" hidden>
          <canvas id="miniBrain" aria-hidden="true"></canvas>
        </div>
        <ul class="sections" id="sectionList"></ul>
        <ul class="sections extra" id="extraList"></ul>
      </nav>
      <main id="main" tabindex="-1"></main>
    </div>

    <div class="savebar" id="saveBar" hidden>
      <span id="saveCount"></span>
      <button class="btn ghost" id="discardAll" type="button">Discard</button>
      <button class="btn primary" id="reviewButton" type="button">Review and save</button>
    </div>

    <dialog class="sheet" id="reviewDialog" aria-labelledby="reviewTitle"></dialog>
    <dialog class="sheet narrow" id="formDialog"></dialog>
    <dialog class="sheet" id="buildDialog" aria-labelledby="buildTitle"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="/brain.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
