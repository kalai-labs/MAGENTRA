name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two releases must not run at the same time. A second release would use an old
# version, because the first release did not push its commit yet.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # A fork must not make a release in its own repository, and a manual run
    # (workflow_dispatch can target any branch) releases from main only.
    if: github.event.repository.fork == false && github.ref == 'refs/heads/main'
    # The build matrix below needs to know whether a release happened and
    # which tag to build and upload to.
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The version tool reads the tags and the commits of the full history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # TODO(tests): restore when the new suite lands. This gated every release
      # on the deleted tools/version/test/ suite. Until it is rebuilt, a release
      # runs with the version tool unverified — the tool still writes VERSION,
      # CHANGELOG.md and the tag below with no test standing behind it.
      #
      # - name: Test the version tool
      #   run: npm run test:version

      - name: Set the identity of the release author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # The tool writes VERSION, CHANGELOG.md and the target files. Then it
      # makes a commit and a tag. The commit message holds `[skip ci]`.
      # Therefore this job does not start again for the release commit.
      - name: Make the release
        id: release
        run: node tools/version/bin/magentra-version.mjs apply

      - name: Push the commit and the tag
        if: steps.release.outputs.released == 'true'
        run: git push --follow-tags origin main

      # The annotated tag holds the changelog of this release. Therefore the
      # notes of the GitHub release are the same as the changelog.
      #
      # It is created as a DRAFT. A draft is excluded from /releases/latest,
      # which is the path every client resolves to find an update. A release
      # published before its binaries exist would answer that call with a tag
      # whose channel file is missing, and the update check would then fail for
      # every user at once — not merely be delayed. The `publish` job below flips
      # the draft only once every platform's artifacts are attached.
      - name: Draft the GitHub release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --notes-from-tag --draft

      - name: Report the result
        run: |
          if [ '${{ steps.release.outputs.released }}' = 'true' ]; then
            echo "Released ${{ steps.release.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No release. No commit changes the version.' >> "$GITHUB_STEP_SUMMARY"
          fi

  # Build the desktop artifacts on each OS and attach them to the draft release
  # the job above created. Per-OS runners keep packaging honest: every artifact
  # bundles the ripgrep binary npm installed natively for that platform, and
  # bundle-engine.js --target fails the build if it is missing.
  #
  # latest.yml is the channel file electron-updater reads for the one
  # self-updating format left, Windows NSIS. macOS ships unsigned, so it can
  # never replace itself and needs no channel file — see
  # docs/adr/0009-updates-have-two-tiers.md.
  #
  # There is no Linux leg: MAGENTRA does not ship Linux binaries — see
  # decisions/0014-magentra-does-not-ship-linux.md, which also records what to
  # put back. `app/main/updates.js` still KNOWS the Linux formats (AppImage,
  # deb, tar.gz) on purpose, so a self-built copy still resolves its own tier.
  binaries:
    name: Binaries (${{ matrix.name }})
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            dist: dist:win
            upload: app/dist/*.exe app/dist/latest.yml
          # macos-latest is arm64; the dmg ships an arm64 app + arm64 ripgrep.
          # Intel macs would need a second (x64) runner — deliberately out of
          # scope until someone asks for it.
          - name: mac
            os: macos-latest
            dist: dist:mac
            upload: app/dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build exactly what was released, not whatever main moved on to.
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the engine
        run: npm run build

      - name: Package the app
        run: npm run ${{ matrix.dist }}

      # LAUNCH WHAT WAS JUST PACKAGED. `ci.yml` already smokes the app, but it
      # smokes it from SOURCE, and a packaging fault cannot show up there by
      # construction: a missing bundled engine, an unresolved native module, an
      # asar that omitted a file are all defects OF the artifact, so only the
      # artifact can show them. Without this step the first run of a release
      # build is the user's.
      #
      # `--smoke` exits 0 five seconds after the renderer's first paint and 1 if
      # the renderer crashed (app/main.js). A non-zero exit fails the leg, and a
      # failed leg leaves the release a draft that no client can resolve — the
      # safe direction the `publish` job below already relies on.
      #
      # `Start-Process -Wait`, NOT `& $exe`. The portable exe is a GUI-subsystem
      # program, and PowerShell's call operator neither waits for one nor sets
      # $LASTEXITCODE: `&` returned in 0.1s, $LASTEXITCODE stayed $null, and
      # `$null -ne 0` failed the leg as "the packaged app exited " — with no
      # number, because nothing had exited yet. The portable wrapper itself
      # waits for the app and passes its exit code on (ExecWait + SetErrorLevel
      # in app-builder-lib's portable.nsi), so waiting on the wrapper is enough.
      - name: Smoke the packaged app (windows)
        if: matrix.name == 'windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = Get-ChildItem app/dist/*-win-portable.exe | Select-Object -First 1
          if (-not $exe) { throw "no portable exe was packaged" }
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "the packaged app exited $($proc.ExitCode)" }

      # The dmg is what gets uploaded, so the dmg is what gets launched: mounting
      # it proves the shipped image carries an app that runs, which running the
      # unpacked mac-arm64/ tree beside it would not.
      #
      # The signature is checked first. A launch from here never meets
      # Gatekeeper (a CI build carries no quarantine flag), so an app whose seal
      # is broken still smokes green — and a user who downloads it gets
      # "MAGENTRA is damaged and can't be opened" (v0.19.4). afterPack.js signs
      # the bundle ad hoc; this fails the release if that seal is not valid.
      - name: Smoke the packaged app (mac)
        if: matrix.name == 'mac'
        run: |
          set -euo pipefail
          dmg=$(ls app/dist/*.dmg | head -1)
          mountpoint=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mountpoint" -nobrowse -quiet
          trap 'hdiutil detach "$mountpoint" -quiet || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$mountpoint/MAGENTRA.app"
          "$mountpoint/MAGENTRA.app/Contents/MacOS/MAGENTRA" --smoke

      - name: Upload the artifacts to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" ${{ matrix.upload }} --clobber

  # Publish the draft, and only now. Every platform in the matrix must have
  # succeeded: `needs` fails this job if any leg failed, so a packaging break
  # leaves the release a draft that no client can see. That is the safe
  # direction — users keep being offered the previous release, which works.
  #
  # To retract a release after this point, do NOT delete it: flip it back with
  # `gh release edit <tag> --prerelease`, which takes it out of /releases/latest
  # while leaving it installable for anyone who already has the link. Deleting it
  # would strand a client mid-download.
  publish:
    name: Publish the release
    needs: [release, binaries]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Undraft the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "$TAG" --draft=false
          echo "Published $TAG with all artifacts attached." >> "$GITHUB_STEP_SUMMARY"
